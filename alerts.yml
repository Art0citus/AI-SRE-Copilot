groups:
  - name: ai-sre-alerts
    rules:
      - alert: HighServerErrorRate
        expr: |
          sum(rate(http_requests_total{status=~"5.."}[1m])) > 0.1
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "High HTTP 5xx error rate"
          description: "The application is returning server errors."